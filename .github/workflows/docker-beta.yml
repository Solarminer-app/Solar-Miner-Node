name: Build and publish SolarMiner beta images

on:
  push:
    branches:
      - beta

permissions:
  contents: read

concurrency:
  group: solarminer-node-beta-images
  cancel-in-progress: false

jobs:
  metadata:
    name: Read beta image metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      frontend_image: ${{ steps.metadata.outputs.frontend_image }}
      core_image: ${{ steps.metadata.outputs.core_image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read image names and commit tag
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          echo "tag=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$(./gradlew -q printFrontendImage)" >> "$GITHUB_OUTPUT"
          echo "core_image=$(./gradlew -q printCoreImage)" >> "$GITHUB_OUTPUT"

  build-native-images:
    name: Build ${{ matrix.component }} ${{ matrix.arch }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: core
            task: :core:bootBuildImage
            clean_task: :core:clean
            arch: amd64
            runner: ubuntu-latest
            image_suffix: amd64
          - component: core
            task: :core:bootBuildImage
            clean_task: :core:clean
            arch: arm64
            runner: ubuntu-24.04-arm
            image_suffix: arm64
          - component: frontend
            task: :bootBuildImage
            clean_task: :clean
            arch: amd64
            runner: ubuntu-latest
            image_suffix: jvm-amd64
          - component: frontend
            task: :bootBuildImage
            clean_task: :clean
            arch: arm64
            runner: ubuntu-24.04-arm
            image_suffix: jvm-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish commit-tagged image
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          TASK: ${{ matrix.task }}
          CLEAN_TASK: ${{ matrix.clean_task }}
          IMAGE_SUFFIX: ${{ matrix.image_suffix }}
          TAG: ${{ needs.metadata.outputs.tag }}
          FRONTEND_IMAGE: ${{ needs.metadata.outputs.frontend_image }}
          CORE_IMAGE: ${{ needs.metadata.outputs.core_image }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          case "$COMPONENT" in
            core) IMAGE="$CORE_IMAGE" ;;
            frontend) IMAGE="$FRONTEND_IMAGE" ;;
            *) echo "Unknown component: $COMPONENT" >&2; exit 1 ;;
          esac

          ./gradlew "$CLEAN_TASK" "$TASK" \
            --imageName="${IMAGE}:${TAG}-${IMAGE_SUFFIX}-beta" \
            --publishImage \
            -x test \
            --no-daemon

  publish-multi-arch-tags:
    name: Publish beta manifests
    needs:
      - metadata
      - build-native-images
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create beta and commit-specific manifests
        shell: bash
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          FRONTEND_IMAGE: ${{ needs.metadata.outputs.frontend_image }}
          CORE_IMAGE: ${{ needs.metadata.outputs.core_image }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${CORE_IMAGE}:latest-amd64-beta" \
            "${CORE_IMAGE}:${TAG}-amd64-beta"

          docker buildx imagetools create \
            --tag "${CORE_IMAGE}:latest-arm64-beta" \
            "${CORE_IMAGE}:${TAG}-arm64-beta"

          docker buildx imagetools create \
            --tag "${CORE_IMAGE}:${TAG}-beta" \
            --tag "${CORE_IMAGE}:latest-beta" \
            "${CORE_IMAGE}:${TAG}-amd64-beta" \
            "${CORE_IMAGE}:${TAG}-arm64-beta"

          docker buildx imagetools create \
            --tag "${FRONTEND_IMAGE}:latest-amd64-jvm-beta" \
            "${FRONTEND_IMAGE}:${TAG}-jvm-amd64-beta"

          docker buildx imagetools create \
            --tag "${FRONTEND_IMAGE}:latest-arm64-jvm-beta" \
            "${FRONTEND_IMAGE}:${TAG}-jvm-arm64-beta"

          docker buildx imagetools create \
            --tag "${FRONTEND_IMAGE}:${TAG}-jvm-beta" \
            --tag "${FRONTEND_IMAGE}:latest-jvm-beta" \
            "${FRONTEND_IMAGE}:${TAG}-jvm-amd64-beta" \
            "${FRONTEND_IMAGE}:${TAG}-jvm-arm64-beta"
