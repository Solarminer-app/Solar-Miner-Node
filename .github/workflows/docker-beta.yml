name: Build and publish SolarMiner beta images

on:
  push:
    branches:
      - beta

permissions:
  contents: read

concurrency:
  group: solarminer-node-beta-images
  cancel-in-progress: false

jobs:
  metadata:
    name: Read beta image metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      frontend_image: ${{ steps.metadata.outputs.frontend_image }}
      core_image: ${{ steps.metadata.outputs.core_image }}
      currency_rates_image: ${{ steps.metadata.outputs.currency_rates_image }}
      pc_agent_image: ${{ steps.metadata.outputs.pc_agent_image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read image names and commit tag
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          echo "tag=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$(./gradlew -q printFrontendImage)" >> "$GITHUB_OUTPUT"
          echo "core_image=$(./gradlew -q printCoreImage)" >> "$GITHUB_OUTPUT"
          echo "currency_rates_image=$(./gradlew -q printCurrencyRatesImage)" >> "$GITHUB_OUTPUT"
          echo "pc_agent_image=$(./gradlew -q printPcAgentImage)" >> "$GITHUB_OUTPUT"

  build-native-images:
    name: Build ${{ matrix.component }} ${{ matrix.arch }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: core
            task: :core:bootBuildImage
            clean_task: :core:clean
            arch: amd64
            runner: ubuntu-latest
            image_suffix: amd64
          - component: core
            task: :core:bootBuildImage
            clean_task: :core:clean
            arch: arm64
            runner: ubuntu-24.04-arm
            image_suffix: arm64
          - component: frontend
            task: :bootBuildImage
            clean_task: :clean
            arch: amd64
            runner: ubuntu-latest
            image_suffix: jvm-amd64
          - component: frontend
            task: :bootBuildImage
            clean_task: :clean
            arch: arm64
            runner: ubuntu-24.04-arm
            image_suffix: jvm-arm64
          - component: currency-rates
            task: :currency-rates:bootBuildImage
            clean_task: :currency-rates:clean
            arch: amd64
            runner: ubuntu-latest
            image_suffix: amd64
          - component: currency-rates
            task: :currency-rates:bootBuildImage
            clean_task: :currency-rates:clean
            arch: arm64
            runner: ubuntu-24.04-arm
            image_suffix: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish commit-tagged image
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          TASK: ${{ matrix.task }}
          CLEAN_TASK: ${{ matrix.clean_task }}
          IMAGE_SUFFIX: ${{ matrix.image_suffix }}
          TAG: ${{ needs.metadata.outputs.tag }}
          FRONTEND_IMAGE: ${{ needs.metadata.outputs.frontend_image }}
          CORE_IMAGE: ${{ needs.metadata.outputs.core_image }}
          CURRENCY_RATES_IMAGE: ${{ needs.metadata.outputs.currency_rates_image }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          case "$COMPONENT" in
            core) IMAGE="$CORE_IMAGE" ;;
            frontend) IMAGE="$FRONTEND_IMAGE" ;;
            currency-rates) IMAGE="$CURRENCY_RATES_IMAGE" ;;
            *) echo "Unknown component: $COMPONENT" >&2; exit 1 ;;
          esac

          ./gradlew "$CLEAN_TASK" "$TASK" \
            --imageName="${IMAGE}:${TAG}-${IMAGE_SUFFIX}-beta" \
            --publishImage \
            -x test \
            --no-daemon

  publish-pc-agent:
    name: Build and publish PC-Agent beta image
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Solarminer-app/solarminer-stratum-proxy
          ref: beta
          path: embedded-proxy-src

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish PC-Agent beta tags
        uses: docker/build-push-action@v6
        with:
          context: .
          file: pc-agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.metadata.outputs.pc_agent_image }}:${{ needs.metadata.outputs.tag }}-amd64-beta
            ${{ needs.metadata.outputs.pc_agent_image }}:latest-amd64-beta
            ${{ needs.metadata.outputs.pc_agent_image }}:latest-beta
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-pc-agent-beta-release-assets:
    name: Build PC-Agent beta release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Solarminer-app/solarminer-stratum-proxy
          ref: beta
          path: embedded-proxy-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build standalone PC-Agent JAR
        run: |
          chmod +x ./gradlew
          ./gradlew :pc-agent:test :pc-agent:standaloneJar \
            -Psolarminer.proxy.project-dir=embedded-proxy-src \
            --no-daemon

      - name: Prepare beta launcher assets and checksum
        shell: bash
        run: |
          set -euo pipefail
          cp pc-agent/standalone/start-agent-beta.bat pc-agent/build/distributions/
          cp pc-agent/standalone/start-agent-beta.ps1 pc-agent/build/distributions/
          cd pc-agent/build/distributions
          sha256sum solarminer-pc-agent-standalone.jar > solarminer-pc-agent-standalone.jar.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: pc-agent-beta-release-assets
          path: pc-agent/build/distributions/*
          if-no-files-found: error
          retention-days: 7

  publish-pc-agent-beta-release:
    name: Publish PC-Agent prerelease
    needs:
      - build-pc-agent-beta-release-assets
      - publish-pc-agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pc-agent-beta-release-assets
          path: release-assets

      - name: Create beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          SHORT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${SHORT_SHA:0:12}"
          TAG="pc-agent-beta-${SHORT_SHA}"
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SolarMiner PC-Agent Beta ${SHORT_SHA}" \
            --notes "Beta build from commit ${TARGET_SHA}. The beta launcher downloads the latest published PC-Agent beta release." \
            --prerelease \
            --target "$TARGET_SHA"

  publish-multi-arch-tags:
    name: Publish beta manifests
    needs:
      - metadata
      - build-native-images
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create beta and commit-specific manifests
        shell: bash
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          FRONTEND_IMAGE: ${{ needs.metadata.outputs.frontend_image }}
          CORE_IMAGE: ${{ needs.metadata.outputs.core_image }}
          CURRENCY_RATES_IMAGE: ${{ needs.metadata.outputs.currency_rates_image }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${CORE_IMAGE}:latest-amd64-beta" \
            "${CORE_IMAGE}:${TAG}-amd64-beta"

          docker buildx imagetools create \
            --tag "${CORE_IMAGE}:latest-arm64-beta" \
            "${CORE_IMAGE}:${TAG}-arm64-beta"

          docker buildx imagetools create \
            --tag "${CORE_IMAGE}:${TAG}-beta" \
            --tag "${CORE_IMAGE}:latest-beta" \
            "${CORE_IMAGE}:${TAG}-amd64-beta" \
            "${CORE_IMAGE}:${TAG}-arm64-beta"

          docker buildx imagetools create \
            --tag "${FRONTEND_IMAGE}:latest-amd64-jvm-beta" \
            "${FRONTEND_IMAGE}:${TAG}-jvm-amd64-beta"

          docker buildx imagetools create \
            --tag "${FRONTEND_IMAGE}:latest-arm64-jvm-beta" \
            "${FRONTEND_IMAGE}:${TAG}-jvm-arm64-beta"

          docker buildx imagetools create \
            --tag "${FRONTEND_IMAGE}:${TAG}-jvm-beta" \
            --tag "${FRONTEND_IMAGE}:latest-jvm-beta" \
            "${FRONTEND_IMAGE}:${TAG}-jvm-amd64-beta" \
            "${FRONTEND_IMAGE}:${TAG}-jvm-arm64-beta"

          docker buildx imagetools create \
            --tag "${CURRENCY_RATES_IMAGE}:latest-amd64-beta" \
            "${CURRENCY_RATES_IMAGE}:${TAG}-amd64-beta"

          docker buildx imagetools create \
            --tag "${CURRENCY_RATES_IMAGE}:latest-arm64-beta" \
            "${CURRENCY_RATES_IMAGE}:${TAG}-arm64-beta"

          docker buildx imagetools create \
            --tag "${CURRENCY_RATES_IMAGE}:${TAG}-beta" \
            --tag "${CURRENCY_RATES_IMAGE}:latest-beta" \
            "${CURRENCY_RATES_IMAGE}:${TAG}-amd64-beta" \
            "${CURRENCY_RATES_IMAGE}:${TAG}-arm64-beta"
