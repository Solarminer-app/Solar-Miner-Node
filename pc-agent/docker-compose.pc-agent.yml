services:
  pc-agent:
    image: verdox/solar-miner-pc-agent:latest
    container_name: solarminer-pc-agent
    restart: unless-stopped
    # This image deliberately has no embedded proxy. Configure a reachable
    # SolarMiner proxy through the local agent UI after startup.
    ports:
      - "8084:8084"
      - "8091:8091/udp"
    init: true
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock: -1
    volumes:
      - ./data:/data
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0
