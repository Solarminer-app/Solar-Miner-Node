<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1020">
    <title>SolarMiner · Pools</title>
    <link rel="stylesheet" href="/agent.css">
    <link rel="stylesheet" href="/workspace.css">
    <link rel="stylesheet" href="/design.css">
    <script src="/i18n.js" defer></script>
    <script src="/workspace.js" defer></script>
    <script src="/wallet-strip.js" defer></script>
    <script src="/telemetry-gate.js" defer></script>
    <script src="/mining-cache.js" defer></script>
    <script src="/components.js" defer></script>
    <script src="/pool-catalog.js" defer></script>
    <script src="/pools.js" defer></script>
</head>
<body class="pools-page">
<div class="shell">
    <header class="topbar"><a class="brand" href="/">☼ <span>SolarMiner <small>PC-Agent</small></span></a>
        <nav class="nav"><a href="/">Dashboard</a><a href="/mining.html">Miner</a><a href="/workers.html">Worker</a><a
                class="selected" href="/pools.html">Pools</a><a href="/benchmarks.html">Benchmarks</a><a
                href="/hardware.html">Leistungsgrenzen</a><a href="/telemetry.html">Sensoren</a><a
                href="/proxy.html">Verbindung</a></nav>
        <div class="top-actions"><span id="connection" class="badge">Verbinde …</span>
            <button id="refresh" type="button" class="button subtle">Aktualisieren</button>
        </div>
    </header>
    <section id="wallet-strip" class="wallet-strip" aria-label="Wallet-Kontostände"></section>
    <main>
        <div class="page-title">
            <div><p class="kicker">BETRIEB</p><h1>Pools</h1>
                <p>Der Miner spricht immer den SolarMiner-Proxy an. Hier wählst du, welches Pool-Ziel der Proxy für
                    einen Coin verwendet.</p></div>
            <a class="button subtle" href="/proxy.html">Proxy verbinden →</a></div>
        <div id="status-strip" class="sticky-strip" aria-label="Verbindungsstatus"></div>
        <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
        <div class="filter-bar">
            <input id="pool-search" class="scope-search" type="search" placeholder="Coin, Pool oder Adresse suchen"
                   aria-label="Pools durchsuchen">
            <a href="/workers.html">Worker ansehen →</a>
        </div>
        <div id="pool-summary" class="kpi-strip" aria-live="polite"></div>
        <div id="pool-boards" class="pool-boards"></div>
        <footer>SolarMiner PC-Agent</footer>
    </main>
</div>
</body>
</html>
