services:
  pc-agent:
    image: verdox/solar-miner-pc-agent-standalone:latest
    container_name: solarminer-pc-agent-standalone
    restart: unless-stopped
    # Standalone mode embeds the local Stratum proxy and uses LAN UDP discovery.
    # It is intended for a trusted LAN host, not a public internet endpoint.
    network_mode: host
    init: true
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock: -1
    volumes:
      - ./data:/data
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0
