spring.application.name=currency-rates
server.port=8080
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# MYSQL_* is used by Compose; without it the service keeps its local H2 default.
spring.datasource.url=${MYSQL_URL:jdbc:h2:file:/workspace/data/currency_rates;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${MYSQL_USER:sa}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

server.tomcat.threads.max=15
server.tomcat.threads.min-spare=5
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

spring.flyway.locations=classpath:db/migration
